name: BotRelay qualification
on:
  push:
    branches: ['qualification/**']
    paths: ['index.html', 'impressum.html', 'styles.css', 'assets/relay-qr.png', 'README.md', 'relay-proof.json', '.relay/verify.mjs', '.github/workflows/relay-qualification.yml']
permissions:
  contents: read
concurrency:
  group: relay-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify demo handover
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated audit tools
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/relay-empty-global.npmrc
        run: |
          cd "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/relay-audit" --ignore-scripts --no-audit --no-fund playwright-core@1.62.1 lighthouse@13.5.0
      - name: Verify website, capture screenshots and Lighthouse
        run: node .relay/verify.mjs
      - name: Upload original verified evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: botrelay-qualification
          path: .relay/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          archive: true
